<g font-family="Arial, sans-serif">
<text x="72" y="180" fill="#f0f0e8" font-size="45" letter-spacing="-1">Understand the setup.</text>
<text x="72" y="238" fill="#f0f0e8" font-size="45" letter-spacing="-1">See the risk. Decide with clarity.</text>
<text x="72" y="310" fill="#a4b0a8" font-size="18">IDENTITY STUDY / PROVISIONAL NAME / SEPTEMBER 2026</text>
